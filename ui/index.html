<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="author" content="J. Helix">
  <meta name="description" content="JHELIX（词旋）· 四级高频词汇桌面学习工具，本地离线、可点击、可复习。">
  <title>JHELIX · 今日学习</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <svg class="svg-sprite" aria-hidden="true" focusable="false">

    <symbol id="i-tree" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="20" r="2"/><path d="M12 6v4M6 18v-4h12v4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.4l6.1-.9L12 3Z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v1a4 4 0 0 0 4 4M16 6h3v1a4 4 0 0 1-4 4"/><path d="M12 12v5M8 21h8M9 17h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 7.6 15a1.7 1.7 0 0 0-1.6-1H5.8v-2.6H6a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h2.6v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2V14h-.2a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4.4 0 7-2.8 7-6.6 0-2.7-1.5-5.1-3.1-7C14.3 6.6 13 4.7 13 2c-3 2.2-4.2 5-3.5 7.3-1.1-.2-2.1-1-2.6-2.1C5 9.4 5 11.6 5 13.4 5 19.2 7.6 22 12 22Z"/><path d="M9.4 17.3c0-1.7 1.2-2.6 2-4.1.9 1.4 2.6 2.6 2.6 4.2a2.4 2.4 0 0 1-4.6-.1Z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3.5c4.5 0 6.5 12 11 12H21"/><path d="m18 15 3 3-3 3"/><path d="M3 18h3.5c1.4 0 2.6-1.1 3.8-2.7"/><path d="M13.2 8.7C14.2 7.1 15.3 6 16.5 6H21"/><path d="m18 3 3 3-3 3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.7 4.6"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5M7 10l5-5 5 5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.2 6.2L20 11l-5.8 2.8L12 20l-2.2-6.2L4 11l5.8-2.8L12 2Z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.1M10 9h.1M14 9h.1M18 9h.1M6 13h.1M18 13h.1M8 16h8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="14" r="6"/><path d="m8 3 2.5 5M16 3l-2.5 5M12 11v6M9.5 14h5"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 7 4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7Z"/><path d="M5 19h14"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark">JH</div>
        <div class="brand__copy"><b>JHELIX</b><span>词旋 · CET-4 VOCAB</span></div>
        <span class="brand__ver">v1.0</span>
      </div>

      <nav class="nav" aria-label="主导航">
        <div class="nav__group">
          <div class="nav__label">学习</div>
          <button class="nav__item" data-page="today">
            <span class="nav__ico"><svg class="ico"><use href="#i-home"></use></svg></span>
            <span class="nav__text">今日学习</span>
            <span class="nav__badge" id="nav-due" hidden></span>
          </button>
          <button class="nav__item" data-page="flashcards">
            <span class="nav__ico"><svg class="ico"><use href="#i-cards"></use></svg></span>
            <span class="nav__text">闪卡速记</span>
          </button>
          <button class="nav__item" data-page="quiz">
            <span class="nav__ico"><svg class="ico"><use href="#i-quiz"></use></svg></span>
            <span class="nav__text">选择测验</span>
          </button>
          <button class="nav__item" data-page="spelling">
            <span class="nav__ico"><svg class="ico"><use href="#i-edit"></use></svg></span>
            <span class="nav__text">拼写挑战</span>
          </button>
          <button class="nav__item" data-page="listening">
            <span class="nav__ico"><svg class="ico"><use href="#i-headphones"></use></svg></span>
            <span class="nav__text">听音辨词</span>
          </button>
        </div>

        <div class="nav__group">
          <div class="nav__label">词库</div>
          <button class="nav__item" data-page="library">
            <span class="nav__ico"><svg class="ico"><use href="#i-library"></use></svg></span>
            <span class="nav__text">完整词库</span>
          </button>
          <button class="nav__item" data-page="families">
            <span class="nav__ico"><svg class="ico"><use href="#i-tree"></use></svg></span>
            <span class="nav__text">词族图谱</span>
          </button>
          <button class="nav__item" data-page="starred">
            <span class="nav__ico"><svg class="ico"><use href="#i-star"></use></svg></span>
            <span class="nav__text">生词本</span>
            <span class="nav__badge" id="nav-star" hidden></span>
          </button>
        </div>

        <div class="nav__group">
          <div class="nav__label">成长</div>
          <button class="nav__item" data-page="stats">
            <span class="nav__ico"><svg class="ico"><use href="#i-chart"></use></svg></span>
            <span class="nav__text">学习统计</span>
          </button>
          <button class="nav__item" data-page="achievements">
            <span class="nav__ico"><svg class="ico"><use href="#i-trophy"></use></svg></span>
            <span class="nav__text">成就徽章</span>
          </button>
        </div>

        <div class="nav__group">
          <div class="nav__label">系统</div>
          <button class="nav__item" data-page="settings">
            <span class="nav__ico"><svg class="ico"><use href="#i-settings"></use></svg></span>
            <span class="nav__text">设置与帮助</span>
          </button>
        </div>
      </nav>

      <div class="side-card">
        <div class="side-card__top"><span>今日目标</span><b id="side-goal-text">0 / 25</b></div>
        <div class="meter meter--slim"><i id="side-goal-bar" style="width:0%"></i></div>
        <div class="side-card__hint" id="side-streak">连续 0 天 · Lv.1</div>
      </div>

      <div class="side-foot">
        <button class="side-exit" id="side-exit">
          <svg class="ico"><use href="#i-power"></use></svg>
          <span>退出软件</span>
        </button>
        <div class="side-foot__hint">本地离线 · 不上传数据</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__left">
          <div class="topbar__search">
            <svg class="ico"><use href="#i-search"></use></svg>
            <input id="global-search" type="search" placeholder="搜单词 / 中文释义 / 音标…" autocomplete="off" spellcheck="false">
            <kbd>Ctrl K</kbd>
            <div class="search-pop" id="search-pop" hidden></div>
          </div>
        </div>
        <div class="topbar__right">
          <span class="pill pill--streak" id="top-streak"></span>
          <span class="pill pill--level" id="top-level"></span>
          <span class="pill pill--today" id="top-today"></span>
          <button class="icon-btn" id="theme-toggle" title="切换主题"></button>
          <button class="icon-btn" data-go="#/settings" title="设置与帮助"><svg class="ico"><use href="#i-info"></use></svg></button>
        </div>
      </header>

      <main id="view" class="view">
        <div class="loading-card">
          <div class="loading-card__ring"></div>
          <h2>正在整理你的词库…</h2>
          <p>四级高频词，马上就好。</p>
        </div>
      </main>

      <footer class="footer">
        <span>JHELIX · 本地离线学习工具</span>
        <span id="foot-meta">词库加载中 · v1.0.0</span>
      </footer>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="confetti-root" class="confetti-root" aria-hidden="true"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
